{% extends "admin_base.html" %}

{% block content %}

<h2>Instruments</h2>

<table>

    <tr>
        <th>Name</th>
        <th>Room</th>
        <th>Delete</th>
    </tr>

    {% for i in instruments %}

    <tr>

        <td>
            {{ i["name"] }}
        </td>

        <td>
            {{ i["room"] }}
        </td>

        <td>

            <form action="/admin/instruments/delete"
                  method="post">

                <input type="hidden"
                       name="id"
                       value="{{ i['id'] }}">

                <button type="submit">
                    Delete
                </button>

            </form>

        </td>

    </tr>

    {% endfor %}

</table>

<hr>

<h3>Add Instrument</h3>

<form action="/admin/instruments/add"
      method="post">

    <input name="name"
           placeholder="Instrument name">

    <select name="room_id">

        {% for r in rooms %}

        <option value="{{ r['id'] }}">
            {{ r['name'] }}
        </option>

        {% endfor %}

    </select>

    <button type="submit">
        Add
    </button>

</form>

{% endblock %}
