<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
</head>

<body>

    <h2>Administrator Login</h2>

    <form method="POST">

        <p>
            Username<br>
            <input name="username">
        </p>

        <p>
            Password<br>
            <input type="password"
                   name="password">
        </p>

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}
    <p style="color:red">
        {{ error }}
    </p>
    {% endif %}

</body>
</html>
