{% extends "admin_base.html" %}

{% block content %}

<h2>Members</h2>

<table>

    <tr>
        <th>Name</th>
        <th>Delete</th>
    </tr>

    {% for u in users %}

    <tr>

        <td>{{u["name"]}}</td>

        <td>

            <form action="/admin/users/delete"
                  method="post">

                <input type="hidden"
                       name="id"
                       value="{{u['id']}}">

                <button>Delete</button>

            </form>

        </td>

    </tr>

    {% endfor %}

</table>

<hr>

<form action="/admin/users/add"
      method="post">

    <input name="name"
           placeholder="New member">

    <button>Add</button>

</form>

{% endblock %}
